<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>{{ app_name }}</title>

  <link rel="stylesheet" href="/static/style.css?v=neuromv-fix-3">
  <link rel="stylesheet" href="/static/splash.css?v=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
</head>
<body>


<div id="bootSplash" class="boot-splash" aria-hidden="true">
  <div class="boot-bg-glow"></div>

<div class="boot-logo-wrap">

<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 512 512"
class="boot-svg"
aria-hidden="true">

<defs>

<linearGradient id="leftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#29ecff"/>
<stop offset="100%" stop-color="#4f8dff"/>
</linearGradient>

<linearGradient id="rightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#6b70ff"/>
<stop offset="100%" stop-color="#df67ff"/>
</linearGradient>

<linearGradient id="nGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#dfe9ff"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<circle
class="energy-core"
cx="256"
cy="256"
r="20"/>

<path
class="brain left"
d="
M255 455
C145 455 82 380 82 300
C82 248 104 213 140 185
C118 95 185 48 245 76
L255 95"
/>

<path
class="brain right"
d="
M257 95
L267 76
C327 48 394 95 372 185
C408 213 430 248 430 300
C430 380 367 455 257 455
"
/>

<path class="trace left"
d="M165 142 L165 240 L215 290"/>

<path class="trace left"
d="M118 248 L190 248"/>

<path class="trace left"
d="M140 330 L190 300"/>

<path class="trace left"
d="M180 390 L215 360"/>

<path class="trace right"
d="M347 142 L347 240 L297 290"/>

<path class="trace right"
d="M394 248 L322 248"/>

<path class="trace right"
d="M372 330 L322 300"/>

<path class="trace right"
d="M332 390 L297 360"/>

<circle class="node left" cx="165" cy="142" r="8"/>
<circle class="node left" cx="118" cy="248" r="8"/>
<circle class="node left" cx="140" cy="330" r="8"/>
<circle class="node left" cx="180" cy="390" r="8"/>

<circle class="node right" cx="347" cy="142" r="8"/>
<circle class="node right" cx="394" cy="248" r="8"/>
<circle class="node right" cx="372" cy="330" r="8"/>
<circle class="node right" cx="332" cy="390" r="8"/>

<circle class="pulse" r="5">
<animateMotion
dur="2.2s"
repeatCount="indefinite"
path="M165 142 L165 240 L215 290"/>
</circle>

<path
class="letterN"
d="
M205 350
V165
L305 350
V165
"/>

</svg>

</div>
</div>


<div class="modal hidden" id="authModal">
  <div class="modal-card">
    <button class="modal-close" id="authCloseBtn" type="button" title="Close">×</button>

    
    
    <div class="auth-logo"><span></span></div>
    <h1>NeuroACC</h1>
    <p>Log in or create an account to sync NeuroMV chats across devices.</p>

    <div class="auth-tabs">
      <button id="showLoginBtn" class="active" type="button">Log In</button>
      <button id="showCreateBtn" type="button">Sign Up</button>
    </div>

    <div class="auth-form" id="loginForm">
      <input id="loginUsername" type="text" placeholder="Username" autocomplete="username">
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginAccountBtn" type="button">Log In</button>
    </div>

    <div class="auth-form hidden" id="createForm">
      <input id="createUsername" type="text" placeholder="Username" autocomplete="username">
      <input id="createPassword" type="password" placeholder="Password" autocomplete="new-password">
      <button id="createAccountBtn" type="button">Create NeuroACC</button>
    </div>

    <p class="auth-error" id="authError"></p>
    <p class="auth-note">Guest mode works without login. NeuroACC syncs your chats.</p>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        
        <div class="logo"><span></span></div>
        <div class="brand-text">
          <h1>NeuroMV</h1>
          <p id="sideSub">Made by Marvell Jonathan</p>
        </div>
      </div>

      <button class="sidebar-close" id="sidebarCloseBtn" type="button" title="Close sidebar">×</button>
    </div>

    <button class="new-chat" id="newChatBtn" type="button">+ New Chat</button>

    <div class="account-box hidden" id="accountBox">
      <div class="account-avatar" id="accountAvatar">N</div>
      <div>
        <strong id="accountName">Guest</strong>
        <p id="accountEmail">NeuroACC</p>
      </div>
      <button id="logoutBtn" type="button" title="Log out">↗</button>
    </div>

    <p class="side-label">Chats</p>
    <div class="history" id="history"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenuBtn" type="button" title="Toggle sidebar">☰</button>

      <div class="top-title">
        <h2 id="chatTitle">New Chat</h2>
        <p id="modeText">Flash mode</p>
      </div>

      <div class="top-auth" id="topAuth">
        <button id="topLoginBtn" type="button">Log In</button>
        <button id="topSignupBtn" class="primary" type="button">Sign Up</button>
      </div>

      <div class="top-user hidden" id="topUser">
        <span id="topUsername">User</span>
        <button id="topLogoutBtn" type="button">Log out</button>
      </div>
    </header>

    <section class="chat" id="chat"></section>

    <form class="composer" id="form">
      <input
        type="file"
        id="fileInput"
        class="hidden"
        accept=".txt,.md,.json,.csv,.py,.js,.html,.css,.xml,.yml,.yaml,.sql,.log,.java,.cpp,.c,.php,.rb,.go,.rs,.ts,.tsx,.jsx,.pdf,.png,.jpg,.jpeg,.webp,.bmp,.tiff,.tif"
      >

      <button type="button" class="attach-btn" id="attachBtn" title="Attach file">＋</button>

      <div class="mode-picker">
        <button type="button" id="modePickerBtn" class="mode-picker-btn">
          <span id="modePickerLabel">⚡ Flash</span>
          <span class="chev">˅</span>
        </button>

        <div class="mode-menu hidden" id="modeMenu">
          <button type="button" class="mode-option active" data-mode="instant">
            <span>⚡</span>
            <div>
              <strong>Flash</strong>
              <p>Fast replies</p>
            </div>
          </button>

          <button type="button" class="mode-option" data-mode="thinking">
            <span>🔍</span>
            <div>
              <strong>Deep Analysis</strong>
              <p>Thinking mode</p>
            </div>
          </button>
        </div>
      </div>

      <div class="input-wrap">
        <div class="attachment-preview hidden" id="attachmentPreview"></div>
        <textarea id="input" rows="1" placeholder="Message NeuroMV..."></textarea>
      </div>

      <button id="sendBtn" type="submit">Send</button>
    </form>
  </main>
</div>

<script>
window.MathJax = {
  tex: {
    inlineMath: [["\\(", "\\)"], ["$", "$"]],
    displayMath: [["\\[", "\\]"], ["$$", "$$"]],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
  }
};
</script>

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="/static/splash.js?v=neuromv-fix-4"></script>
<script src="/static/script.js?v=neuromv-fix-3"></script>
</body>
</html>
